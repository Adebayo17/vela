<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 640" width="1140" height="640" role="img" aria-label="Plateforme de prototypage VELA">
<title>Plateforme de prototypage VELA</title>
<style>
  text { font-family: DejaVu Sans, Helvetica, Arial, sans-serif; }
  .mono { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; }
  .muted { fill: #5b676b; }
  @keyframes flow { to { stroke-dashoffset: -48; } }
  .flow { animation: flow 1.2s linear infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b676b"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a4562a"/></marker></defs>
<rect width="1140" height="640" fill="#ffffff"/>
<text x="30" y="36" font-size="20" text-anchor="start" font-weight="bold" fill="#1f2a2e" >Plateforme de prototypage VELA (cible de la phase 3)</text>
<text x="30" y="60" font-size="13" text-anchor="start" font-weight="normal" class="muted" fill="#1f2a2e" >Arty Z7-20 : Zynq XC7Z020. Blocs pleins = existants et vérifiés ; pointillés = à concevoir en phase 3 ou plus tard.</text>
<rect x="150" y="80" width="830" height="520" rx="12" fill="#fafbfb" stroke="#1f2a2e" stroke-width="2" />
<text x="965" y="104" font-size="14" text-anchor="end" font-weight="bold" fill="#1f2a2e" >Zynq XC7Z020</text>
<rect x="170" y="96" width="560" height="92" rx="8" fill="#eef3f8" stroke="#3b6fd1" stroke-width="1.5" />
<text x="190" y="120" font-size="13" text-anchor="start" font-weight="bold" fill="#3b6fd1" >Processing System (PS)</text>
<rect x="190" y="132" width="170" height="44" rx="6" fill="#ffffff" stroke="#1f2a2e" stroke-width="1.2" />
<text x="275" y="152" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >ARM Cortex-A9</text>
<text x="275" y="168" font-size="10.5" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >bare-metal, 100 MHz PL</text>
<rect x="380" y="132" width="150" height="44" rx="6" fill="#ffffff" stroke="#1f2a2e" stroke-width="1.2" />
<text x="455" y="152" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >SD / GPIO</text>
<text x="455" y="168" font-size="10.5" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >images, BTN, SW, LED</text>
<rect x="550" y="132" width="160" height="44" rx="6" fill="#ffffff" stroke="#1f2a2e" stroke-width="1.2" />
<text x="630" y="152" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >FCLK_CLK0</text>
<text x="630" y="168" font-size="10.5" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >100 MHz (NFR-001)</text>
<rect x="170" y="208" width="790" height="34" rx="17" fill="#f3efe9" stroke="#a4562a" stroke-width="1.5" />
<text x="565" y="230" font-size="13" text-anchor="middle" font-weight="bold" fill="#a4562a" >Bus AXI4-Lite (GP0) : interconnexion + décodage d'adresses</text>
<line x1="275" y1="176" x2="275" y2="206" stroke="#a4562a" stroke-width="2" />
<rect x="180" y="280" width="250" height="150" rx="10" fill="#e7f1ea" stroke="#2f6f4e" stroke-width="1.8" />
<text x="305" y="304" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >IP CNN (Vitis HLS)</text>
<text x="305" y="326" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1f2a2e" >AXI4-Lite : image @0x1000,</text>
<text x="305" y="344" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1f2a2e" >classe @0x10, logits @0x20</text>
<text x="305" y="362" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1f2a2e" >8 MAC/cycle, conv+ReLU+pool</text>
<text x="305" y="380" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1f2a2e" >fusionnés, 5,98 ms / image</text>
<text x="305" y="398" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1f2a2e" >22 DSP · 41 BRAM · 5 % LUT</text>
<line x1="305" y1="242" x2="305" y2="278" stroke="#a4562a" stroke-width="2" marker-end="url(#arrowA)" />
<rect x="470" y="280" width="490" height="150" rx="10" fill="#fbfbfb" stroke="#1f2a2e" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="715" y="302" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >Chaîne de filtres (RTL Verilog)</text>
<rect x="485" y="318" width="90" height="52" rx="6" fill="#fdf3e1" stroke="#b7791f" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="530" y="340" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >SRAM</text>
<text x="530" y="356" font-size="10.5" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >image source</text>
<rect x="595" y="318" width="95" height="52" rx="6" fill="#e7f1ea" stroke="#2f6f4e" stroke-width="1.4" />
<text x="642" y="340" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >grayscale</text>
<text x="642" y="356" font-size="10.5" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >1 pixel/cycle</text>
<rect x="710" y="318" width="120" height="52" rx="6" fill="#e7f1ea" stroke="#2f6f4e" stroke-width="1.4" />
<text x="770" y="336" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >threshold / gaussian</text>
<text x="770" y="351" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >sobel / median</text>
<text x="770" y="365" font-size="10" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >window3x3</text>
<rect x="850" y="318" width="95" height="52" rx="6" fill="#fdf3e1" stroke="#b7791f" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="897" y="340" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >→ RGB565</text>
<text x="897" y="356" font-size="10.5" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >conversion</text>
<line x1="575" y1="344" x2="593" y2="344" stroke="#1f2a2e" stroke-width="1.6" marker-end="url(#arrow)" />
<line x1="690" y1="344" x2="708" y2="344" stroke="#1f2a2e" stroke-width="1.6" marker-end="url(#arrow)" />
<line x1="830" y1="344" x2="848" y2="344" stroke="#1f2a2e" stroke-width="1.6" marker-end="url(#arrow)" />
<text x="715" y="392" font-size="11" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >SW0 : mode filtres / CNN · BTN2/BTN3 : filtre précédent / suivant</text>
<text x="715" y="410" font-size="11" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >pas de contre-pression en sortie → mémoire d'image (TN003 §11)</text>
<line x1="530" y1="242" x2="530" y2="316" stroke="#a4562a" stroke-width="2" marker-end="url(#arrowA)" />
<rect x="560" y="460" width="160" height="60" rx="8" fill="#fdf3e1" stroke="#b7791f" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="640" y="484" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >SRAM d'affichage</text>
<text x="640" y="502" font-size="10.5" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >96x64 RGB565 + texte</text>
<rect x="750" y="460" width="200" height="60" rx="8" fill="#e7f1ea" stroke="#2f6f4e" stroke-width="1.4" />
<text x="850" y="484" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >oled_controller</text>
<text x="850" y="502" font-size="10.5" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >spi_master, 6,25 MHz</text>
<line x1="897" y1="370" x2="897" y2="400" stroke="#1f2a2e" stroke-width="1.4" />
<path d="M897 430 L897 440 L640 440 L640 458" fill="none" stroke="#1f2a2e" stroke-width="1.6" marker-end="url(#arrow)" />
<line x1="720" y1="490" x2="748" y2="490" stroke="#1f2a2e" stroke-width="1.6" marker-end="url(#arrow)" />
<path d="M450 242 L450 490 L556 490" fill="none" stroke="#a4562a" stroke-width="1.6" marker-end="url(#arrowA)" />
<text x="462" y="470" font-size="10.5" text-anchor="start" font-weight="normal" fill="#a4562a" >ARM : texte</text>
<text x="462" y="484" font-size="10.5" text-anchor="start" font-weight="normal" fill="#a4562a" >« CAT 74% »</text>
<rect x="20" y="110" width="110" height="60" rx="6" fill="#ffffff" stroke="#1f2a2e" stroke-width="1.4" />
<text x="75" y="136" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >Carte SD</text>
<text x="75" y="154" font-size="10.5" text-anchor="middle" font-weight="normal" class="mono muted" fill="#1f2a2e" >test_batch.bin</text>
<line x1="130" y1="140" x2="188" y2="152" stroke="#1f2a2e" stroke-width="1.6" marker-end="url(#arrow)" />
<rect x="20" y="200" width="110" height="72" rx="6" fill="#ffffff" stroke="#1f2a2e" stroke-width="1.4" />
<text x="75" y="222" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >BTN0-3</text>
<text x="75" y="240" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >SW0-1</text>
<text x="75" y="258" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >LED</text>
<path d="M130 236 L160 236 L160 160 L378 160" fill="none" stroke="#1f2a2e" stroke-width="1.4" marker-end="url(#arrow)" />
<rect x="1000" y="450" width="120" height="80" rx="8" fill="#1f2a2e" stroke="#1f2a2e" stroke-width="1.5" />
<rect x="1012" y="462" width="96" height="56" rx="3" fill="#2a3a3f" stroke="#3a4a4f" stroke-width="1" />
<text x="1060" y="494" font-size="11" text-anchor="middle" font-weight="bold" fill="#ffffff" >OLED 96x64</text>
<text x="1060" y="548" font-size="11.5" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >Pmod OLEDrgb</text>
<text x="1060" y="563" font-size="10.5" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >SSD1331, connecteur JA</text>
<line x1="950" y1="490" x2="998" y2="490" stroke="#1f2a2e" stroke-width="2" marker-end="url(#arrow)" />
<rect x="1000" y="300" width="120" height="70" rx="8" fill="#eef0f1" stroke="#8a949a" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="1060" y="326" font-size="13" text-anchor="middle" font-weight="bold" fill="#5b676b" >Caméra</text>
<text x="1060" y="344" font-size="11" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >ESP32-CAM</text>
<text x="1060" y="360" font-size="10.5" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >(SW1, futur)</text>
<path d="M1000 335 L962 335" fill="none" stroke="#8a949a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)" />
<path d="M130 140 L188 152 M275 176 L275 206 M305 242 L305 278" fill="none" stroke="#a4562a" stroke-width="3.5" stroke-dasharray="2 10" class="flow" opacity="0.85"/>
<path d="M530 242 L530 316 M575 344 L593 344 M690 344 L708 344 M830 344 L848 344 M897 370 L897 440 L640 440 L640 458 M720 490 L748 490 M950 490 L998 490" fill="none" stroke="#3a9d5d" stroke-width="3.5" stroke-dasharray="2 10" class="flow" opacity="0.85"/>
<rect x="150" y="600" width="22" height="16" rx="4" fill="#e7f1ea" stroke="#2f6f4e" stroke-width="1.4" />
<text x="180" y="613" font-size="12" text-anchor="start" font-weight="normal" class="muted" fill="#1f2a2e" >existant, vérifié</text>
<rect x="400" y="600" width="22" height="16" rx="4" fill="#fdf3e1" stroke="#b7791f" stroke-width="1.4" />
<text x="430" y="613" font-size="12" text-anchor="start" font-weight="normal" class="muted" fill="#1f2a2e" >à concevoir en phase 3</text>
<rect x="650" y="600" width="22" height="16" rx="4" fill="#eef0f1" stroke="#8a949a" stroke-width="1.4" />
<text x="680" y="613" font-size="12" text-anchor="start" font-weight="normal" class="muted" fill="#1f2a2e" >extension future</text>
<path d="M900 608 L940 608" fill="none" stroke="#a4562a" stroke-width="3.5" stroke-dasharray="2 10" class="flow"/>
<text x="948" y="613" font-size="12" text-anchor="start" font-weight="normal" class="muted" fill="#1f2a2e" >flux de données</text>
</svg>
