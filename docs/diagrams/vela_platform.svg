<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 712" width="1140" height="712" role="img" aria-label="Plateforme de prototypage VELA">
<title>Plateforme de prototypage VELA</title>
<style>
  text { font-family: DejaVu Sans, Helvetica, Arial, sans-serif; }
  .mono { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; }
  .muted { fill: #5b676b; }
  @keyframes flow { to { stroke-dashoffset: -48; } }
  .flow { animation: flow 1.2s linear infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b676b"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a4562a"/></marker></defs>
<rect width="1140" height="712" fill="#ffffff"/>
<text x="30" y="36" font-size="20" text-anchor="start" font-weight="bold" fill="#1f2a2e" >Plateforme de prototypage VELA (phase 3, TN007)</text>
<text x="30" y="60" font-size="13" text-anchor="start" font-weight="normal" class="muted" fill="#1f2a2e" >Arty Z7-20 : Zynq XC7Z020. Blocs pleins = existants et vérifiés ; pointillés = à concevoir en phase 3 ou plus tard.</text>
<rect x="150" y="80" width="830" height="500" rx="12" fill="#fafbfb" stroke="#1f2a2e" stroke-width="2" />
<text x="965" y="104" font-size="14" text-anchor="end" font-weight="bold" fill="#1f2a2e" >Zynq XC7Z020</text>
<rect x="170" y="96" width="560" height="92" rx="8" fill="#eef3f8" stroke="#3b6fd1" stroke-width="1.5" />
<text x="190" y="120" font-size="13" text-anchor="start" font-weight="bold" fill="#3b6fd1" >Processing System (PS)</text>
<rect x="190" y="132" width="170" height="44" rx="6" fill="#ffffff" stroke="#1f2a2e" stroke-width="1.2" />
<text x="275.0" y="152" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >ARM Cortex-A9</text>
<text x="275.0" y="168" font-size="10.5" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >prétraitement, softmax, texte</text>
<rect x="380" y="132" width="150" height="44" rx="6" fill="#ffffff" stroke="#1f2a2e" stroke-width="1.2" />
<text x="455.0" y="152" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >SD0 · UART</text>
<text x="455.0" y="168" font-size="10.5" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >images, console</text>
<rect x="550" y="132" width="160" height="44" rx="6" fill="#ffffff" stroke="#1f2a2e" stroke-width="1.2" />
<text x="630.0" y="152" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >FCLK_CLK0</text>
<text x="630.0" y="168" font-size="10.5" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >100 MHz (NFR-001)</text>
<rect x="170" y="208" width="790" height="34" rx="17" fill="#f3efe9" stroke="#a4562a" stroke-width="1.5" />
<text x="565" y="230" font-size="13" text-anchor="middle" font-weight="bold" fill="#a4562a" >M_AXI_GP0 → SmartConnect (AXI4-Lite) : décodage d'adresses, 5 esclaves</text>
<line x1="275" y1="176" x2="275" y2="206" stroke="#a4562a" stroke-width="2" />
<rect x="170" y="270" width="230" height="130" rx="10" fill="#e7f1ea" stroke="#2f6f4e" stroke-width="1.8" />
<text x="285" y="293" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >IP CNN (Vitis HLS)</text>
<text x="285" y="314" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1f2a2e" >reçoit de l'ARM l'image</text>
<text x="285" y="332" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1f2a2e" >prétraitée 24×24 (@0x1000)</text>
<text x="285" y="350" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1f2a2e" >classe @0x10, logits @0x20</text>
<text x="285" y="368" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1f2a2e" >5,98 ms · 22 DSP · 41 BRAM</text>
<line x1="285" y1="242" x2="285" y2="268" stroke="#a4562a" stroke-width="2" marker-end="url(#arrowA)" />
<text x="291" y="262" font-size="10" text-anchor="start" font-weight="normal" fill="#a4562a" >image 24×24</text>
<rect x="170" y="430" width="230" height="66" rx="8" fill="#fdf3e1" stroke="#b7791f" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="285" y="452" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >AXI GPIO ×2</text>
<text x="285" y="469" font-size="10.5" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >BTN · SW · LED</text>
<text x="285" y="484" font-size="10.5" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >start · mode · busy · done</text>
<path d="M410 242 L410 452 L402 452" fill="none" stroke="#5b676b" stroke-width="1.4" marker-end="url(#arrow)" />
<line x1="400" y1="470" x2="438" y2="470" stroke="#1f2a2e" stroke-width="1.4" marker-end="url(#arrow)" />
<rect x="470" y="270" width="180" height="62" rx="8" fill="#fdf3e1" stroke="#b7791f" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="560" y="291" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >BRAM source</text>
<text x="560" y="307" font-size="10.5" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >64×64 RGB888</text>
<text x="560" y="322" font-size="10" text-anchor="middle" font-weight="normal" class="mono muted" fill="#1f2a2e" >@0x4200_0000</text>
<rect x="780" y="270" width="180" height="62" rx="8" fill="#fdf3e1" stroke="#b7791f" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="870" y="291" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >BRAM d'affichage</text>
<text x="870" y="307" font-size="10.5" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >image 64×64 | texte 32×64</text>
<text x="870" y="322" font-size="10" text-anchor="middle" font-weight="normal" class="mono muted" fill="#1f2a2e" >@0x4202_0000</text>
<line x1="560" y1="242" x2="560" y2="268" stroke="#a4562a" stroke-width="2" marker-end="url(#arrowA)" />
<text x="566" y="262" font-size="10" text-anchor="start" font-weight="normal" fill="#a4562a" >image ×2</text>
<line x1="870" y1="242" x2="870" y2="268" stroke="#a4562a" stroke-width="2" marker-end="url(#arrowA)" />
<text x="864" y="262" font-size="10" text-anchor="end" font-weight="normal" fill="#a4562a" >texte seul → zone texte</text>
<rect x="425" y="365" width="545" height="195" rx="10" fill="#fbfbfb" stroke="#1f2a2e" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="440" y="384" font-size="12.5" text-anchor="start" font-weight="bold" fill="#1f2a2e" >vela_pl (RTL Verilog, module reference)</text>
<rect x="440" y="398" width="320" height="142" rx="8" fill="#fdf3e1" stroke="#b7791f" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="600" y="418" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >filter_engine</text>
<text x="600" y="440" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2a2e" >0 copie · 1 grayscale · 2 grayscale → threshold</text>
<text x="600" y="458" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2a2e" >3 gaussian ×3 (R, G, B) · 4 grayscale → sobel</text>
<text x="600" y="476" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2a2e" >5 median ×3 (R, G, B)   puis → RGB565</text>
<text x="600" y="506" font-size="10.5" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >filtres existants (TN003) instanciés tels quels</text>
<text x="600" y="522" font-size="10.5" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >image 64×64 en ≈ 41 µs → zone image seule</text>
<rect x="780" y="398" width="180" height="52" rx="8" fill="#fdf3e1" stroke="#b7791f" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="870" y="420" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >display_reader</text>
<text x="870" y="437" font-size="10.5" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >lecture en boucle</text>
<rect x="780" y="478" width="180" height="62" rx="8" fill="#e7f1ea" stroke="#2f6f4e" stroke-width="1.4" />
<text x="870" y="502" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >oled_controller</text>
<text x="870" y="519" font-size="10.5" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >spi_master, 6,25 MHz</text>
<line x1="560" y1="332" x2="560" y2="396" stroke="#1f2a2e" stroke-width="1.6" marker-end="url(#arrow)" />
<path d="M740 398 L740 355 L830 355 L830 334" fill="none" stroke="#1f2a2e" stroke-width="1.6" marker-end="url(#arrow)" />
<text x="836" y="350" font-size="10" text-anchor="start" font-weight="normal" class="muted" fill="#1f2a2e" >écriture</text>
<line x1="910" y1="332" x2="910" y2="396" stroke="#1f2a2e" stroke-width="1.6" marker-end="url(#arrow)" />
<line x1="870" y1="450" x2="870" y2="476" stroke="#1f2a2e" stroke-width="1.6" marker-end="url(#arrow)" />
<rect x="20" y="110" width="110" height="60" rx="6" fill="#ffffff" stroke="#1f2a2e" stroke-width="1.4" />
<text x="75" y="136" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >Carte SD</text>
<text x="75" y="154" font-size="10.5" text-anchor="middle" font-weight="normal" class="mono muted" fill="#1f2a2e" >test_batch.bin</text>
<line x1="130" y1="140" x2="188" y2="152" stroke="#1f2a2e" stroke-width="1.6" marker-end="url(#arrow)" />
<rect x="20" y="420" width="110" height="72" rx="6" fill="#ffffff" stroke="#1f2a2e" stroke-width="1.4" />
<text x="75" y="442" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >BTN0-3</text>
<text x="75" y="460" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >SW0-1</text>
<text x="75" y="478" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >LED0-3</text>
<line x1="130" y1="456" x2="168" y2="456" stroke="#1f2a2e" stroke-width="1.4" />
<rect x="1000" y="470" width="120" height="80" rx="8" fill="#1f2a2e" stroke="#1f2a2e" stroke-width="1.5" />
<rect x="1012" y="482" width="96" height="56" rx="3" fill="#2a3a3f" stroke="#3a4a4f" stroke-width="1" />
<text x="1060" y="514" font-size="11" text-anchor="middle" font-weight="bold" fill="#ffffff" >OLED 96x64</text>
<text x="1060" y="568" font-size="11.5" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >Pmod OLEDrgb</text>
<text x="1060" y="583" font-size="10.5" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >SSD1331, connecteur JA</text>
<line x1="960" y1="510" x2="998" y2="510" stroke="#1f2a2e" stroke-width="2" marker-end="url(#arrow)" />
<rect x="1000" y="380" width="120" height="70" rx="8" fill="#eef0f1" stroke="#8a949a" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="1060" y="406" font-size="13" text-anchor="middle" font-weight="bold" fill="#5b676b" >Caméra</text>
<text x="1060" y="424" font-size="11" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >ESP32-CAM</text>
<text x="1060" y="440" font-size="10.5" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >(SW1, futur)</text>
<path d="M1000 415 L972 415" fill="none" stroke="#8a949a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)" />
<rect x="20" y="596" width="1100" height="74" rx="8" fill="#f6e9df" stroke="#a4562a" stroke-width="1.2" />
<text x="36" y="617" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2a2e" >Mode CNN (SW0 = 1) : SD → ARM (crop 24×24, normalisation) → IP CNN → classe → ARM → zone texte ; image ×2 → BRAM source → filter_engine (copie) → zone image.</text>
<text x="36" y="637" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2a2e" >Mode filtres (SW0 = 0) : SD → ARM → BRAM source (image ×2) → filter_engine (filtre) → zone image ; nom du filtre → zone texte. Un seul écrivain par zone.</text>
<text x="36" y="657" font-size="12" text-anchor="start" font-weight="normal" class="muted" fill="#1f2a2e" >×2 : chaque pixel de l'image CIFAR 32×32 devient un carré 2×2 → 64×64 à gauche de l'écran 96×64 ; les 32 colonnes de droite servent au texte.</text>
<path d="M130 140 L188 152 M275 176 L275 206 M285 242 L285 268 M870 242 L870 268" fill="none" stroke="#a4562a" stroke-width="3.5" stroke-dasharray="2 10" class="flow" opacity="0.85"/>
<path d="M560 242 L560 268 M560 332 L560 396 M740 398 L740 355 L830 355 L830 334 M910 332 L910 396 M870 450 L870 476 M960 510 L998 510" fill="none" stroke="#3a9d5d" stroke-width="3.5" stroke-dasharray="2 10" class="flow" opacity="0.85"/>
<rect x="150" y="682" width="22" height="16" rx="4" fill="#e7f1ea" stroke="#2f6f4e" stroke-width="1.4" />
<text x="180" y="695" font-size="12" text-anchor="start" font-weight="normal" class="muted" fill="#1f2a2e" >existant, vérifié</text>
<rect x="400" y="682" width="22" height="16" rx="4" fill="#fdf3e1" stroke="#b7791f" stroke-width="1.4" />
<text x="430" y="695" font-size="12" text-anchor="start" font-weight="normal" class="muted" fill="#1f2a2e" >à concevoir en phase 3</text>
<rect x="650" y="682" width="22" height="16" rx="4" fill="#eef0f1" stroke="#8a949a" stroke-width="1.4" />
<text x="680" y="695" font-size="12" text-anchor="start" font-weight="normal" class="muted" fill="#1f2a2e" >extension future</text>
<path d="M900 690 L940 690" fill="none" stroke="#a4562a" stroke-width="3.5" stroke-dasharray="2 10" class="flow"/>
<text x="948" y="695" font-size="12" text-anchor="start" font-weight="normal" class="muted" fill="#1f2a2e" >flux de données</text>
</svg>
