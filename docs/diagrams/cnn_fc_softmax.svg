<text x="46" y="454" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2a2e" >Exemple réel : image de test n°0 (golden model) → « cat » à 73.8 %.</text>
<text x="46" y="474" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2a2e" >Dans VELA, l'IP calcule les logits et la classe (argmax, exact) ; l'ARM calcule la probabilité affichée sur l'OLED (TN004 §6, TN005 §5).</text>
<text x="46" y="492" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2a2e" >L'ordre HWC de la mise à plat est imposé par l'ordre d'apprentissage des poids M (TN001).</text>
