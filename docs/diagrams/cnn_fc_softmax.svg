<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" width="1180" height="520" role="img" aria-label="Mise à plat HWC, couche dense et softmax">
<title>Mise à plat HWC, couche dense et softmax</title>
