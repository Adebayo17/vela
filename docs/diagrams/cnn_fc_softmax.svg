<g class="pos" style="animation-delay:0.0s"><rect x="300" y="100" width="26" height="28" rx="2" fill="#e7f1ea" stroke="#2f6f4e" stroke-width="1.2" /><text x="334" y="119" font-size="11" text-anchor="start" font-weight="normal" class="mono" fill="#1f2a2e" >(0,0) c=0..19  → v[0..19]</text></g>
