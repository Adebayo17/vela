<rect width="1180" height="520" fill="#ffffff"/>
<text x="30" y="36" font-size="19" text-anchor="start" font-weight="bold" fill="#1f2a2e" >Mise à plat (HWC), couche dense et softmax</text>
<text x="30" y="62" font-size="13" text-anchor="start" font-weight="normal" class="muted" fill="#1f2a2e" >pool3 (20×3×3) → vecteur de 180 valeurs dans l'ordre (h, w, c) → S = M·v + b (10 logits) → softmax → probabilités</text>
