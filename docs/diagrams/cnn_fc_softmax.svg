<g class="pos" style="animation-delay:4.2s"><rect x="104" y="208" width="34" height="34" rx="3" fill="#e7f1ea" stroke="#2f6f4e" stroke-width="1.4" /><text x="121.0" y="223" font-size="10" text-anchor="middle" font-weight="normal" class="mono" fill="#1f2a2e" >(2,1)</text><text x="121.0" y="236" font-size="9.5" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >20 c</text></g>
<g class="pos" style="animation-delay:4.8s"><rect x="148" y="208" width="34" height="34" rx="3" fill="#e7f1ea" stroke="#2f6f4e" stroke-width="1.4" /><text x="165.0" y="223" font-size="10" text-anchor="middle" font-weight="normal" class="mono" fill="#1f2a2e" >(2,2)</text><text x="165.0" y="236" font-size="9.5" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >20 c</text></g>
