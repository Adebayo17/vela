<g class="pos" style="animation-delay:1.8s"><rect x="60" y="164" width="34" height="34" rx="3" fill="#e7f1ea" stroke="#2f6f4e" stroke-width="1.4" /><text x="77.0" y="179" font-size="10" text-anchor="middle" font-weight="normal" class="mono" fill="#1f2a2e" >(1,0)</text><text x="77.0" y="192" font-size="9.5" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >20 c</text></g>
