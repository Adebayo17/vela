<g class="pos" style="animation-delay:3.6s"><rect x="300" y="280" width="26" height="28" rx="2" fill="#e7f1ea" stroke="#2f6f4e" stroke-width="1.2" /><text x="334" y="299" font-size="11" text-anchor="start" font-weight="normal" class="mono" fill="#1f2a2e" >(2,0) c=0..19  → v[120..139]</text></g>
<g class="pos" style="animation-delay:4.2s"><rect x="300" y="310" width="26" height="28" rx="2" fill="#e7f1ea" stroke="#2f6f4e" stroke-width="1.2" /><text x="334" y="329" font-size="11" text-anchor="start" font-weight="normal" class="mono" fill="#1f2a2e" >(2,1) c=0..19  → v[140..159]</text></g>
<g class="pos" style="animation-delay:4.8s"><rect x="300" y="340" width="26" height="28" rx="2" fill="#e7f1ea" stroke="#2f6f4e" stroke-width="1.2" /><text x="334" y="359" font-size="11" text-anchor="start" font-weight="normal" class="mono" fill="#1f2a2e" >(2,2) c=0..19  → v[160..179]</text></g>
<text x="313" y="394" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >v : 180</text>
<text x="313" y="412" font-size="11.5" text-anchor="middle" font-weight="normal" class="mono muted" fill="#1f2a2e" >index = (h·3 + w)·20 + c</text>
<rect x="620" y="160" width="120" height="130" rx="8" fill="#f6e9df" stroke="#a4562a" stroke-width="1.6" />
<text x="680" y="200" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2a2e" >S = M·v + b</text>
<text x="680" y="224" font-size="12" text-anchor="middle" font-weight="normal" class="mono" fill="#1f2a2e" >M : 10×180</text>
<text x="680" y="244" font-size="12" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >1 800 MAC</text>
<text x="680" y="264" font-size="12" text-anchor="middle" font-weight="normal" class="muted" fill="#1f2a2e" >(+ 10 biais)</text>
<line x1="540" y1="225" x2="612" y2="225" stroke="#a4562a" stroke-width="1.6" marker-end="url(#arrowA)" />
<line x1="740" y1="225" x2="790" y2="225" stroke="#a4562a" stroke-width="1.6" marker-end="url(#arrowA)" />
<text x="765" y="214" font-size="11" text-anchor="middle" font-weight="normal" fill="#a4562a" >logits</text>
<text x="800" y="96" font-size="12" text-anchor="start" font-weight="normal" class="mono" fill="#1f2a2e" >softmax(z)_i = exp(z_i) / Σ_j exp(z_j)</text>
