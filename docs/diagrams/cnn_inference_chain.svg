<text x="30" y="36" font-size="19" text-anchor="start" font-weight="bold" fill="#1f2a2e" >Chaîne d'inférence du CNN VELA : chaque couche transforme une feature map</text>
<text x="30" y="60" font-size="13" text-anchor="start" font-weight="normal" class="muted" fill="#1f2a2e" >Feature map = tableau 3D (canaux × hauteur × largeur), stocké en CHW. Dimensions réelles du réseau CIFAR-10 de VELA.</text>
<text x="30" y="88" font-size="12" text-anchor="start" font-weight="normal" fill="#a4562a" >a : conv1 3×3, 64 noyaux + ReLU   ·   b : maxpool 3×3 / 2   ·   c : conv2 3×3, 32 noyaux + ReLU   ·   d : maxpool 3×3 / 2</text>
<text x="30" y="108" font-size="12" text-anchor="start" font-weight="normal" fill="#a4562a" >e : conv3 3×3, 20 noyaux + ReLU   ·   f : maxpool 3×3 / 2   ·   g : reshape HWC   ·   h : FC 180→10 (M·v + b)   ·   i : softmax</text>
