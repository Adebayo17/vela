<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 670" width="1130" height="670" role="img" aria-label="Étapes de la méthodologie HW appliquées à VELA">
<title>Étapes de la méthodologie HW appliquées à VELA</title>
<style>
  text { font-family: DejaVu Sans, Helvetica, Arial, sans-serif; }
  .mono { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; }
  .muted { fill: #5b676b; }
  @keyframes step { 0%, 12.00% { opacity: 1; } 12.50%, 100% { opacity: 0.35; } }
  .step { animation: step 20.0s linear infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b676b"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a4562a"/></marker></defs>
<rect width="1130" height="670" fill="#ffffff"/>
<text x="30" y="36" font-size="20" text-anchor="start" font-weight="bold" fill="#1f2a2e" >Étapes de la méthodologie HW appliquées à VELA</text>
<text x="30" y="62" font-size="13" text-anchor="start" font-weight="normal" class="muted" fill="#1f2a2e" >D'après le cours SEI « Projet d'intégration des SoC » : chaque étape est validée contre la précédente avant de passer à la suivante.</text>
<g class="step" style="animation-delay:0.0s"><rect x="30" y="92" width="520" height="112" rx="8" fill="#e7f1ea" stroke="#2f6f4e" stroke-width="1.6" /><circle cx="58" cy="122" r="16" fill="#2f6f4e"/><text x="58" y="127" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff" >1</text><text x="86" y="127" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2a2e" >Référence algorithmique</text><rect x="458" y="108" width="78" height="22" rx="11" fill="#ffffff" stroke="#2f6f4e" stroke-width="1.2" /><text x="497" y="123" font-size="11" text-anchor="middle" font-weight="bold" fill="#2f6f4e" >FAIT</text><text x="86" y="152" font-size="12.5" text-anchor="start" font-weight="normal" class="mono" fill="#1f2a2e" >Golden model Python : python/cnn.py</text><text x="86" y="169" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2a2e" >poids CNN_coeff_3x3.txt, CIFAR-10</text><text x="86" y="186" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2a2e" >précision 74,46 % (10 000 images)</text></g>
<line x1="58" y1="204" x2="58" y2="224" stroke="#5b676b" stroke-width="1.5" marker-end="url(#arrow)" />
<g class="step" style="animation-delay:2.5s"><rect x="30" y="226" width="520" height="112" rx="8" fill="#e7f1ea" stroke="#2f6f4e" stroke-width="1.6" /><circle cx="58" cy="256" r="16" fill="#2f6f4e"/><text x="58" y="261" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff" >2</text><text x="86" y="261" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2a2e" >Algorithme en virgule fixe</text><rect x="458" y="242" width="78" height="22" rx="11" fill="#ffffff" stroke="#2f6f4e" stroke-width="1.2" /><text x="497" y="257" font-size="11" text-anchor="middle" font-weight="bold" fill="#2f6f4e" >FAIT</text><text x="86" y="286" font-size="12.5" text-anchor="start" font-weight="normal" class="mono" fill="#1f2a2e" >Référence C++ double : hls/cnn_ref.cpp</text><text x="86" y="303" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2a2e" >plages de valeurs → types ap_fixed (TN004)</text><text x="86" y="320" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2a2e" >hls/cnn_hw.cpp + cnn_weights.h (16 bits)</text></g>
<line x1="58" y1="338" x2="58" y2="358" stroke="#5b676b" stroke-width="1.5" marker-end="url(#arrow)" />
<g class="step" style="animation-delay:5.0s"><rect x="30" y="360" width="520" height="112" rx="8" fill="#e7f1ea" stroke="#2f6f4e" stroke-width="1.6" /><circle cx="58" cy="390" r="16" fill="#2f6f4e"/><text x="58" y="395" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff" >3</text><text x="86" y="395" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2a2e" >Virgule fixe HLS synthétisable</text><rect x="458" y="376" width="78" height="22" rx="11" fill="#ffffff" stroke="#2f6f4e" stroke-width="1.2" /><text x="497" y="391" font-size="11" text-anchor="middle" font-weight="bold" fill="#2f6f4e" >FAIT</text><text x="86" y="420" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2a2e" >C-simulation Vitis HLS 2024.2</text><text x="86" y="437" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2a2e" >+ g++ / pytest : bit-exact vs modèle TN004</text><text x="86" y="454" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2a2e" >99,99 % d'accord avec le golden model</text></g>
<line x1="58" y1="472" x2="58" y2="492" stroke="#5b676b" stroke-width="1.5" marker-end="url(#arrow)" />
<g class="step" style="animation-delay:7.5s"><rect x="30" y="494" width="520" height="112" rx="8" fill="#e7f1ea" stroke="#2f6f4e" stroke-width="1.6" /><circle cx="58" cy="524" r="16" fill="#2f6f4e"/><text x="58" y="529" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff" >4</text><text x="86" y="529" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2a2e" >Vérification vs fichiers de référence</text><rect x="458" y="510" width="78" height="22" rx="11" fill="#ffffff" stroke="#2f6f4e" stroke-width="1.2" /><text x="497" y="525" font-size="11" text-anchor="middle" font-weight="bold" fill="#2f6f4e" >FAIT</text><text x="86" y="554" font-size="12.5" text-anchor="start" font-weight="normal" class="mono" fill="#1f2a2e" >Co-simulation C/RTL (xsim)</text><text x="86" y="571" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2a2e" >tb_images.bin → RTL → comparé à tb_expected.bin</text><text x="86" y="588" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2a2e" >3/3 bit-exact, latence 5,98 ms</text></g>
<g class="step" style="animation-delay:10.0s"><rect x="580" y="92" width="520" height="112" rx="8" fill="#fdf3e1" stroke="#b7791f" stroke-width="1.6" /><circle cx="608" cy="122" r="16" fill="#b7791f"/><text x="608" y="127" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff" >5</text><text x="636" y="127" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2a2e" >Émulation avec entrées de référence</text><rect x="1008" y="108" width="78" height="22" rx="11" fill="#ffffff" stroke="#b7791f" stroke-width="1.2" /><text x="1047" y="123" font-size="11" text-anchor="middle" font-weight="bold" fill="#b7791f" >PHASE 3</text><text x="636" y="152" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2a2e" >IP sur la carte, images de référence</text><text x="636" y="169" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2a2e" >chargées en mémoire, sortie comparée</text><text x="636" y="186" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2a2e" >aux résultats attendus</text></g>
<line x1="608" y1="204" x2="608" y2="224" stroke="#5b676b" stroke-width="1.5" marker-end="url(#arrow)" />
<g class="step" style="animation-delay:12.5s"><rect x="580" y="226" width="520" height="112" rx="8" fill="#fdf3e1" stroke="#b7791f" stroke-width="1.6" /><circle cx="608" cy="256" r="16" fill="#b7791f"/><text x="608" y="261" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff" >6</text><text x="636" y="261" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2a2e" >Paramétrage du HW par SW</text><rect x="1008" y="242" width="78" height="22" rx="11" fill="#ffffff" stroke="#b7791f" stroke-width="1.2" /><text x="1047" y="257" font-size="11" text-anchor="middle" font-weight="bold" fill="#b7791f" >PHASE 3</text><text x="636" y="286" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2a2e" >ARM (PS) ↔ IP en AXI4-Lite (TN005)</text><text x="636" y="303" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2a2e" >image @0x1000, ap_start, ap_done,</text><text x="636" y="320" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2a2e" >classe @0x10 : IP prête, logiciel à écrire</text></g>
<line x1="608" y1="338" x2="608" y2="358" stroke="#5b676b" stroke-width="1.5" marker-end="url(#arrow)" />
<g class="step" style="animation-delay:15.0s"><rect x="580" y="360" width="520" height="112" rx="8" fill="#fdf3e1" stroke="#b7791f" stroke-width="1.6" /><circle cx="608" cy="390" r="16" fill="#b7791f"/><text x="608" y="395" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff" >7</text><text x="636" y="395" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2a2e" >Validation sur émulateur</text><rect x="1008" y="376" width="78" height="22" rx="11" fill="#ffffff" stroke="#b7791f" stroke-width="1.2" /><text x="1047" y="391" font-size="11" text-anchor="middle" font-weight="bold" fill="#b7791f" >PHASE 3</text><text x="636" y="420" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2a2e" >Carte SD → ARM (prétraitement)</text><text x="636" y="437" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2a2e" >→ IP CNN → OLED SSD1331 96x64</text><text x="636" y="454" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2a2e" >(au lieu de la sortie vidéo HDMI)</text></g>
<line x1="608" y1="472" x2="608" y2="492" stroke="#5b676b" stroke-width="1.5" marker-end="url(#arrow)" />
<g class="step" style="animation-delay:17.5s"><rect x="580" y="494" width="520" height="112" rx="8" fill="#eef0f1" stroke="#8a949a" stroke-width="1.6" stroke-dasharray="6 4"/><circle cx="608" cy="524" r="16" fill="#8a949a"/><text x="608" y="529" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff" >8</text><text x="636" y="529" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2a2e" >Système avec entrée/sortie vidéo</text><rect x="1008" y="510" width="78" height="22" rx="11" fill="#ffffff" stroke="#8a949a" stroke-width="1.2" /><text x="1047" y="525" font-size="11" text-anchor="middle" font-weight="bold" fill="#8a949a" >FUTUR</text><text x="636" y="554" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2a2e" >Caméra ESP32-CAM (switch SW1)</text><text x="636" y="571" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2a2e" >→ filtres / CNN → OLED</text><text x="636" y="588" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2a2e" >flux continu : interface AXI-Stream</text></g>
