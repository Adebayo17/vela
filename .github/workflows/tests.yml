# tests.yml — VELA continuous integration: the fast test suite (make test)
#
# Runs on every push to main and on every pull request:
#   - Python golden model and bit-exact models (CNN, filters, display path)
#   - RTL co-simulation with Icarus Verilog, Verilator lint (VELA-NFR-005)
#   - C++ double CNN reference (g++), ARM portable code on the host (gcc)
#   - generated files up to date (diagrams, golden_ref.h)
#
#   - fixed-point CNN (ap_fixed) bit-exact vs its model, with the open-source
#     ap_fixed headers of Xilinx (HLS_arbitrary_Precision_Types, Apache-2.0),
#     pinned to one commit and given to the tests through VITIS_INCLUDE
#
# Not run here (licensed AMD tools, local only): Vivado synthesis and
# implementation, Vitis HLS, Vitis software build, on-board validation.

name: tests

on:
  push:
    branches: [main]
  pull_request:

env:
  # Xilinx/HLS_arbitrary_Precision_Types, pinned commit (2019-03-19)
  AP_TYPES_REPO: https://github.com/Xilinx/HLS_arbitrary_Precision_Types.git
  AP_TYPES_SHA: 200a9aecaadf471592558540dc5a88256cbf880f

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install simulators and compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog verilator g++

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch the ap_fixed headers (pinned commit)
        run: |
          git init -q "$RUNNER_TEMP/ap_types"
          git -C "$RUNNER_TEMP/ap_types" fetch -q --depth 1 "$AP_TYPES_REPO" "$AP_TYPES_SHA"
          git -C "$RUNNER_TEMP/ap_types" checkout -q FETCH_HEAD
          test -f "$RUNNER_TEMP/ap_types/include/ap_fixed.h"
          echo "VITIS_INCLUDE=$RUNNER_TEMP/ap_types/include" >> "$GITHUB_ENV"

      - name: Probe the ap_fixed build (time, memory)
        run: |
          python - <<'PY'
          import sys; sys.path[:0] = ["verif/tests", "python", "verif/models", "tools"]
          from pathlib import Path; import hls_sim
          hls_sim.generate_weights(Path("build/probe"))
          PY
          free -g
          for opt in -O0 -O1 -O2; do
            echo "== g++ $opt"
            ( ulimit -v 10000000
              /usr/bin/time -v timeout 300 g++ $opt -std=c++14 -isystem "$VITIS_INCLUDE" \
                -Wno-unknown-pragmas -Wno-unused-label -Ihls -Ibuild/probe/generated \
                hls/cnn_hw.cpp hls/tb/cnn_hw_main.cpp -o build/probe/cnn_hw_main ) 2>&1 \
              | grep -E "error|memory|Elapsed|Maximum resident|Exit status" | head -8 || true
          done

      - name: Tool versions
        run: |
          python --version
          iverilog -V 2>&1 | head -1
          verilator --version
          g++ --version | head -1

      - name: Fast test suite (make test)
        run: make test
