name: VELA — CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # ── Job 1 : Tests unitaires et couverture ──────────────────────────────
  unit-tests:
    name: Unit Tests (Python CNN layers)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install numpy pytest pytest-cov

      - name: Run unit tests with coverage
        run: |
          pytest impl_2_cnn_sw/Phase1_Python/tests/ \
            -v \
            --cov=impl_2_cnn_sw/Phase1_Python \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --tb=short \
            -m "not slow"

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ── Job 2 : Matrice de traçabilité ────────────────────────────────────
  traceability:
    name: Traceability Matrix Check
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run traceability scanner
        run: |
          python tools/traceability_scanner.py \
            --srs docs/SRS_VELA.md \
            --tests impl_2_cnn_sw/Phase1_Python/tests/ \
            --source impl_2_cnn_sw/Phase1_Python/ \
            --output traceability_report.md \
            --fail-on-uncovered

      - name: Upload traceability report
        uses: actions/upload-artifact@v4
        with:
          name: traceability-report
          path: traceability_report.md

  # ── Job 3 : Vérification du style de code ────────────────────────────
  lint:
    name: Code Style Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: |
          flake8 impl_2_cnn_sw/Phase1_Python/ \
            --max-line-length=100 \
            --exclude=__pycache__ \
            --count --statistics