[pytest]
testpaths           = python/tests verif/tests
pythonpath          = python verif/models tools
python_files        = test_*.py
python_classes      = Test*
python_functions    = test_*

addopts = -v --tb=short --strict-markers
markers = 
    slow: slow tests requiring CIFAR-10 data files
    requirement: links test to SRS requirement ID
minversion = 7.0